name: Create github and npm releases

on:
  push:
    tags:
      - v*

permissions:
  id-token: write  # Required for OIDC
  contents: write

env:
  NODE_VERSION: 26.5

jobs:
  check-release:
    name: Check release is good and ready
    uses: ./.github/workflows/check-pr.yml
    with:
      skip-deduplication: true

  make-release:
    name: Make github and npm releases
    runs-on: ubuntu-latest
    needs: check-release
    env:
      UNSTABLE_RELEASE: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

    steps:
      - name: Verify boolean env.UNSTABLE_RELEASE
        run: echo ${{ env.UNSTABLE_RELEASE == true  }}
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Setup runtime and dependencies
        uses: pnpm/setup@v1
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Make .d.ts
        run: pnpm make-types
      - name: Publish package
        run: pnpm publish --no-git-checks --provenance --tag ${{ case(fromJSON(env.UNSTABLE_RELEASE), 'next', 'latest') }} --access public
      - name: Generate Changelog
        run: |
          START=$(grep -n "## \[" CHANGELOG.md | head -n 1 | cut -d : -f 1)
          END=$(grep -n "## \[" CHANGELOG.md | head -n 2 | tail -n 1 | cut -d : -f 1)
          awk "NR > $START && NR < $END" CHANGELOG.md | sed -e :a -e '/./,$!d;/^\n*$/{$d;N;};/\n$/ba' > ${{ github.workspace }}-CHANGELOG.temp.md
      - name: Create a github release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ fromJSON(env.UNSTABLE_RELEASE) }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ github.workspace }}-CHANGELOG.temp.md
